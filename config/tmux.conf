# Renkler tam, fare açık (tıkla/kaydır/sürükle)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -s escape-time 10

# Sekmeler 1'den başlasın, kapanınca yeniden numaralansın
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

# Üstte tıklanabilir sekme çubuğu
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#181825,fg=#a6adc8"
set -g status-left ""
set -g status-right-length 60
set -g status-right "#[range=user|split]#[fg=#89b4fa] [böl] #[norange]#[range=user|new]#[fg=#a6e3a1,bold] [+ yeni] #[norange]"
setw -g window-status-format " #I #W#{?#{>:#{session_windows},1},#[norange] #[range=user|kapat#{window_index}]#[fg=#f38ba8]× #[norange], }"
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I #W#{?#{>:#{session_windows},1},#[norange] #[range=user|kapat#{window_index}]#[fg=#f38ba8]× #[norange], }"
setw -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines heavy

# Sekme çubuğuna tıklama: [+ yeni] yeni sekme, [böl] yan yana böl, isim = o sekmeye geç,
# × = o sekmeyi kapat (y/n sorar). Tek sekme kalınca × görünmez: son sekme kapanırsa oturum da kapanır.
# × kendi aralığında olmalı: önce #[norange] ile sekme aralığı biter, arada bir boşluk kalır
# (tmux 3.4 bitişik aralıklarda sınırdaki hücreyi sekmeye sayıyor).
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},new}' {
  new-window -c "#{pane_current_path}"
} {
  if -F '#{==:#{mouse_status_range},split}' {
    split-window -h -c "#{pane_current_path}"
  } {
    if -F '#{&&:#{m:kapat*,#{mouse_status_range}},#{>:#{session_windows},1}}' {
      run -C 'confirm-before -p "#{s/kapat//:mouse_status_range} numaralı sekme kapatılsın mı? (y/n)" "kill-window -t :#{s/kapat//:mouse_status_range}"'
    } {
      select-window -t =
    }
  }
}

# Klavye (Ctrl+b sonra): c yeni sekme, | yan yana böl, - alt alta böl, x bölmeyi kapat, & sekmeyi kapat
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
